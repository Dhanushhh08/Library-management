
<!DOCTYPE html>
<html>
<head>
    <title>Library Login</title>
    <style>
        body {
            font-family: Arial;
            background: #e8eef5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .box {
            background: white;
            padding: 35px;
            border-radius: 10px;
            width: 320px;
            text-align: center;
            box-shadow: 0 4px 15px #0002;
        }
        input {
            box-sizing: border-box;
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        .error { color: red; }
    </style>
</head>
<body>
    <div class="box">
        <h2>Library Management</h2>
        <p>PostgreSQL Login</p>

        {% if error %}
        <p class="error">{{ error }}</p>
        {% endif %}

        <form action="/login" method="POST">
            <input type="text" name="username"
                   placeholder="Username" required>
            <input type="password" name="password"
                   placeholder="Password" required>
            <button type="submit">Login</button>
        </form>
    </div>
</body>
</html>
